<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --ink:    #1b2a41;
  --accent: #e07a3f;
  --civic:  #2f6f9f;
  --excl:   #c0504d;
  --muted:  #6b7280;
  --bg:     #fbfaf7;
}

.reveal { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); }
.reveal .slides { background: var(--bg); }
.reveal section { background: var(--bg); }

.reveal h1, .reveal h2, .reveal h3 {
  font-family: 'Inter', sans-serif; font-weight: 700; color: var(--ink);
  letter-spacing: -0.01em; text-transform: none;
}
.reveal h2 { border-bottom: 3px solid var(--accent); padding-bottom: .25em; }
.reveal p, .reveal li { line-height: 1.4; }

.reveal .muted  { color: var(--muted); }
.reveal .accent { color: var(--accent); font-weight: 600; }
.reveal .civic  { color: var(--civic);  font-weight: 600; }
.reveal .excl   { color: var(--excl);   font-weight: 600; }
.reveal strong  { color: var(--accent); }

/* ── title slide ── */
.reveal .title-dark { background-color: #1b2a41 !important; }
.reveal .title-dark h2 { color: #fbfaf7; border: none; font-size: 2em; line-height: 1.1; }
.reveal .title-dark p  { color: #bcb3a1; }
.reveal .title-sub     { color: #e2dccf !important; font-size: 1.1em; font-weight: 500; }

.reveal .title-light { background-color: #fbfaf7 !important; }
.reveal .title-light h2 { color: #1b2a41; border: none; font-size: 2em; line-height: 1.1; }
.reveal .title-light p  { color: #2f6f9f; }
.reveal .title-light .title-sub { color: #1b2a41 !important; }

/* ── pull-quote ── */
.reveal .bigq {
  font-family: 'Source Serif 4', Georgia, serif;
  font-size: 1.35em; font-style: italic; line-height: 1.35;
  border-left: 5px solid var(--accent); padding-left: .8em; margin: .4em 0;
}
.reveal .src { font-size: .55em; font-style: normal; color: var(--muted); display:block; margin-top:.3em; }

/* ── big question ── */
.reveal .askbig { font-size: 2.4em; font-weight: 700; text-align:center; color: var(--ink); }

/* ── image placeholder ── */
.imgslot {
  border: 2px dashed #c9c2b6; border-radius: 10px; background: #f2efe9;
  color: var(--muted); display:flex; flex-direction:column; align-items:center;
  justify-content:center; text-align:center; height: 200px;
  font-size:.6em; padding:.4em; font-weight:600;
}

/* ── utilities ── */
.reveal .small { font-size: .8em; }
.reveal .tiny  { font-size: .65em; color: var(--muted); }
.reveal table  { font-size: .7em; }
.reveal .promote { background:#fff3e8; border-left:5px solid var(--accent); padding:.4em .7em; border-radius:6px; }
.reveal #refs  { font-size: .5em; }
.reveal .contact a { color: var(--civic); text-decoration: none; }
</style>
